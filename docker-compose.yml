version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: itineraire_db
    environment:
      POSTGRES_DB: itineraire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anass2002
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  itineraire-service:
    build: .
    container_name: itineraire_service
    environment:
      DB_HOST: postgres
      DB_NAME: itineraire_db
      DB_USER: postgres
      DB_PASSWORD: anass2002
    ports:
      - "8083:8083"
    depends_on:
      - postgres

volumes:
  postgres-data:
