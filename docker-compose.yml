services:
  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: itineraire_db_ms4
    environment:
      POSTGRES_DB: itineraire_db
      POSTGRES_USER: itineraire_user
      POSTGRES_PASSWORD: itineraire_password
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itineraire_user -d itineraire_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itineraire-network

  # ================================
  # Backend Spring Boot Service
  # ================================
  itineraire-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itineraire_service_ms4
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itineraire_db
      SPRING_DATASOURCE_USERNAME: itineraire_user
      SPRING_DATASOURCE_PASSWORD: itineraire_password
      TZ: Africa/Casablanca
    ports:
      - "8082:8081"
    volumes:
      - ~/apps:/apps
      - ~/workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/api/routes/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - itineraire-network

  # ================================
  # Frontend with Bun (Production)
  # ================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: itineraire_frontend_ms4
    ports:
      - "3000:80"
    depends_on:
      itineraire-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - itineraire-network

networks:
  itineraire-network:
    driver: bridge

volumes:
  postgres-data:
