services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: itineraire_db
    environment:
      POSTGRES_DB: itineraire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anass2002
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  itineraire-service:
    build: .
    container_name: itineraire_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itineraire_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: anass2002
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
