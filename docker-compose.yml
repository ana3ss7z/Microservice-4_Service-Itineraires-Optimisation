services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: itineraire_db_ms4
    environment:
      POSTGRES_DB: itineraire_db
      POSTGRES_USER: itineraire_user
      POSTGRES_PASSWORD: itineraire_password
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itineraire-network

  itineraire-service:
    build: .
    container_name: itineraire_service_ms4
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itineraire_db
      SPRING_DATASOURCE_USERNAME: itineraire_user
      SPRING_DATASOURCE_PASSWORD: itineraire_password
    ports:
      - "8082:8081"
    volumes:
      - ~/apps:/apps
      - ~/workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - itineraire-network

networks:
  itineraire-network:
    driver: bridge

volumes:
  postgres-data:
